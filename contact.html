<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Contact | My Survival Kit</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="header-wrap">
    <div class="navbar">
      <div class="logo">Tia S.</div>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="kit.html">The Kit</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

      <button class="mode-toggle" aria-label="Toggle color mode">🌙</button>
    </div>
  </div>

  <main class="container">
    <section class="contact-wrap fade-in">
      <h2>Contact / Feedback</h2>

      <!-- mailto submit (client will open mail client) -->
      <form class="contact-form" action="mailto:tiashinholster@icloud.com" method="post" enctype="text/plain">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Write your message..." required></textarea>

        <button class="btn" type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Tia Shinholster</p>
  </footer>

<script src="script.js"></script>
</body>
</html>
